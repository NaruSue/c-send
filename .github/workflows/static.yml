# Simple workflow for deploying static content to GitHub Pages
name: Deploy static content to Pages

on:
  # Allows you to run this workflow manually from the Actions tab
  workflow_dispatch:

# Sets permissions of the GITHUB_TOKEN to allow deployment to GitHub Pages
permissions:
  contents: read
  pages: write
  id-token: write

# Allow only one concurrent deployment, skipping runs queued between the run in-progress and latest queued.
# However, do NOT cancel in-progress runs as we want to allow these production deployments to complete.
concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  # Single deploy job since we're just deploying
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Pages
        uses: actions/configure-pages@v5
      - name: Prepare PWA artifact
        shell: bash
        run: |
          set -eu
          version="$(sed -n 's/^[[:space:]]*const APP_VERSION = "\(.*\)";/\1/p' scripts-ver/pwa/index.html)"
          test -n "$version"
          rm -rf _site
          cp -R scripts-ver/pwa _site
          mkdir -p _site/library/api _site/library/datasets/jp _site/library/datasets/en
          cp scripts-ver/library-site/index.html _site/library/index.html
          python scripts-ver/library-site/generate_catalog.py --output _site/library
          cp api/*.json _site/library/api/
          cp samples/jp/*.json _site/library/datasets/jp/
          cp samples/en/*.json _site/library/datasets/en/
          sed -i "s/__PWA_VERSION__/$version/g" _site/service-worker.js
      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: '_site'
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
