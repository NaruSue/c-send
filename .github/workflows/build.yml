name: Build

on:
  push:
    branches: ["**"]
  workflow_dispatch:
    inputs:
      ref:
        description: Branch, tag, or commit to build. Leave blank to use the selected workflow ref.
        required: false
        type: string

permissions:
  contents: read

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          clean: true
          fetch-depth: 0
          ref: ${{ inputs.ref || github.ref }}

      - name: Show build target
        shell: pwsh
        run: |
          git rev-parse --short HEAD
          git branch --show-current
          git status --short
          Get-ChildItem -Recurse -File | Select-Object FullName

      - name: Build Release
        shell: pwsh
        run: |
          .\build.cmd Release

      - name: Run API mock tests
        shell: pwsh
        env:
          CSEND_GEMINI_MOCK: success
        run: |
          $exe = Resolve-Path .\Release\x64\csend.exe
          $process = Start-Process -FilePath $exe -ArgumentList '/api', 'ping' -Wait -PassThru
          if ($process.ExitCode -ne 0) { throw "Mock success test failed: $($process.ExitCode)" }
          if ((Get-Clipboard -Raw) -ne 'API_TEST_OK') { throw 'Mock response was not copied to the clipboard.' }

          $env:CSEND_GEMINI_MOCK = 'malformed'
          $process = Start-Process -FilePath $exe -ArgumentList '/api', 'ping' -Wait -PassThru
          if ($process.ExitCode -ne 10) { throw "Mock malformed test failed: $($process.ExitCode)" }

          $env:CSEND_GEMINI_MOCK = 'http401'
          $process = Start-Process -FilePath $exe -ArgumentList '/api', 'ping' -Wait -PassThru
          if ($process.ExitCode -ne 10) { throw "Mock HTTP 401 test failed: $($process.ExitCode)" }

      - name: Inspect release output
        if: always()
        shell: pwsh
        run: |
          if (Test-Path .\Release) {
            Get-ChildItem -Recurse .\Release | Select-Object FullName,Length
          } else {
            Write-Host "Release directory not found."
          }
          if (Test-Path .\Release\x64\csend.exe) {
            Write-Host "csend.exe exists."
          } else {
            Write-Host "csend.exe not found."
          }

      - name: Upload executable
        uses: actions/upload-artifact@v4
        with:
          name: csend-exe-${{ github.run_number }}
          path: Release\x64\csend.exe
          if-no-files-found: error
          retention-days: 14
