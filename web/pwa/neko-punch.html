<html lang="ja"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>ねこパンチ耐久</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#efece5;color:#332e2a;font-family:system-ui,sans-serif}button{font:inherit;cursor:pointer}main{max-width:640px;margin:auto;padding:22px 20px}header{display:flex;justify-content:space-between;align-items:center;font-size:12px;letter-spacing:.12em;color:#766d62}h1{font-size:27px;letter-spacing:.03em;margin:20px 0 5px}p{line-height:1.7}.sub{color:#766d62;font-size:13px;margin-top:0}.stats{display:flex;justify-content:space-between;align-items:end;margin:22px 0 12px}.clock{font-size:38px;font-variant-numeric:tabular-nums;font-weight:700}.label{font-size:11px;color:#766d62}.life{display:flex;gap:4px;margin-top:8px}.life i{height:7px;width:13px;background:#b97053;border-radius:3px}.life i.lost{background:#dbd4ca}.arena{position:relative;height:min(54vh,430px);min-height:300px;border-radius:28px;overflow:hidden;background:#d9e3d9;touch-action:none;user-select:none;box-shadow:inset 0 0 60px #6b866b17}.arena:before{content:'';position:absolute;width:300px;height:85px;border-radius:50%;background:#899f8930;bottom:19px;left:50%;transform:translateX(-50%)}svg.cat{position:absolute;width:300px;height:300px;bottom:20px;left:50%;transform:translateX(-50%);overflow:visible}.fur{fill:var(--fur,#d49a62)}.stripe{stroke:var(--stripe,#a46b3e);stroke-width:10;stroke-linecap:round;fill:none}.arm{transform-origin:150px 190px;transition:transform .12s}.arm.left.ready{transform:rotate(28deg) translateY(-17px)}.arm.right.ready{transform:rotate(-28deg) translateY(-17px)}.arm.left.punch{transform:translate(-20px,-25px) scale(1.15)}.arm.right.punch{transform:translate(20px,-25px) scale(1.15)}.target{position:absolute;width:82px;height:82px;border:3px solid #fff;border-radius:50%;background:#c27c61;box-shadow:0 0 0 7px #ffffff45,0 6px 14px #49362925;display:grid;place-items:center;color:white;font-size:37px;transform:translate(-50%,-50%);touch-action:none;animation:pop .15s ease-out}.target:after{content:'';position:absolute;inset:-8px;border:3px solid #72513d;border-radius:50%;animation:timer var(--window) linear forwards}.target:active{scale:.92}@keyframes timer{to{transform:scale(.8);opacity:0}}@keyframes pop{from{scale:.6}}.feedback{position:absolute;left:0;right:0;top:16px;text-align:center;font-weight:700;font-size:17px;pointer-events:none;color:#46664c}.flash{animation:flash .22s}@keyframes flash{50%{background:#e1ada1}}.overlay{position:absolute;inset:0;background:#edf0e9bF;backdrop-filter:blur(5px);display:flex;align-items:center;justify-content:center;text-align:center;padding:24px;z-index:3}.hidden{display:none!important}.panel h2{font-size:25px;margin:8px 0}.panel p{font-size:13px;color:#625e56}.primary{background:#394f40;color:#fff;padding:14px 30px;border:0;border-radius:40px;font-weight:650}.secondary{background:transparent;border:1px solid #c6bdb0;border-radius:30px;padding:9px 17px;color:#655d52;font-size:12px}.below{display:flex;justify-content:space-between;align-items:center;margin-top:16px}.name{font-size:16px;font-weight:700}.trait{font-size:12px;color:#766d62;margin-top:4px}.instructions{border-top:1px solid #d8d1c7;margin-top:22px;padding-top:15px;font-size:12px;color:#766d62}.badge{font-size:10px;background:#e3ddd2;padding:6px 9px;border-radius:20px}.result{font-size:35px;font-weight:750}button:focus-visible{outline:3px solid #cb8e52;outline-offset:4px}@media(max-width:400px){main{padding:16px}.clock{font-size:32px}.target{width:76px;height:76px}}
.target .remaining{position:absolute;right:-3px;top:-6px;min-width:27px;padding:3px 5px;border-radius:20px;background:#394f40;color:#fff;font-size:17px;font-weight:800}.target.rapid{border-style:double;border-width:5px}.target.tapped{filter:brightness(1.12)}
.panel{max-height:100%;overflow-y:auto;width:100%;overscroll-behavior:contain} .overlay{align-items:center}
.boss-cat svg.cat{width:min(340px,100%);height:min(340px,100%);bottom:4px}.twin-cats svg.cat{width:225px;height:225px;left:28%;bottom:28px}.twin-cats svg.second-cat{left:72%}.celebrating svg.cat{animation:catSing .7s ease-in-out infinite alternate}@keyframes catSing{to{transform:translateX(-50%) translateY(-10px) rotate(3deg)}}
@keyframes choirBounce{to{transform:translateY(-7px) rotate(3deg)}}
.angry-face{display:none}.hissing .angry-face{display:block}.hissing .calm-eyes{display:none}
</style>
<main><header><span>c-send / SECRET ROOM</span><button class="secondary" id="sound" aria-pressed="true">音 ON ♪</button></header><h1>ねこパンチ耐久</h1><p class="sub">この猫の相手、何分できる？</p><div class="stats"><div><div class="label">耐えている時間</div><div class="clock" id="clock">00:00.0</div></div><div><div class="label" id="missLabel">ミス 0 / 10</div><div class="life" id="life"></div></div><div><div class="label">受け止めた</div><strong id="hits">0</strong> 回</div></div>
<div class="arena" id="arena"><svg class="cat" viewBox="0 0 300 300" aria-label="こちらを向いた猫"><ellipse class="fur" cx="150" cy="225" rx="76" ry="65"/><path class="fur" d="M64 105 57 23 119 65M181 65 243 23 236 105"/><path fill="#e6afa4" d="m72 78-4-35 33 24m98 0 32-24-4 35"/><ellipse class="fur" cx="150" cy="123" rx="93" ry="79"/><path class="stripe" d="m128 52 7 23m15-27v26m23-22-8 23"/><ellipse fill="#f0e5d6" cx="150" cy="155" rx="45" ry="29"/><path class="calm-eyes" d="M94 119q12-17 24 0m64 0q12-17 24 0" fill="none" stroke="#332e2a" stroke-width="5" stroke-linecap="round"/><path d="m141 143 18 0-9 9z" fill="#ab6d65"/><path d="M150 152v8m-15 0q7 10 15 0 8 10 15 0" fill="none" stroke="#57473c" stroke-width="3" stroke-linecap="round"/><path d="m65 148 43 5m-40 12 39-5m85-7 43-5m-42 12 39 5" stroke="#6c5949" stroke-width="2"/><g class="arm left" id="left"><ellipse class="fur" cx="87" cy="220" rx="35" ry="43"/><ellipse fill="#e2ada2" cx="87" cy="228" rx="15" ry="12"/><g fill="#e2ada2"><circle cx="69" cy="208" r="6"/><circle cx="86" cy="201" r="6"/><circle cx="102" cy="208" r="6"/></g></g><g class="arm right" id="right"><ellipse class="fur" cx="213" cy="220" rx="35" ry="43"/><ellipse fill="#e2ada2" cx="213" cy="228" rx="15" ry="12"/><g fill="#e2ada2"><circle cx="196" cy="208" r="6"/><circle cx="213" cy="201" r="6"/><circle cx="230" cy="208" r="6"/></g></g><g class="angry-face" aria-hidden="true"><path d="M94 112l24 12m64 0 24-12" fill="none" stroke="#332e2a" stroke-width="5" stroke-linecap="round"/><ellipse cx="150" cy="164" rx="12" ry="8" fill="#a86865"/><path d="m143 158 5 5 5-5" fill="#fff4e5"/></g></svg><div class="feedback" id="feedback" aria-live="polite"></div><div class="overlay" id="overlay"><div class="panel"><div id="intro">お相手は…</div><h2 id="introName"></h2><p id="description"></p><div id="result" class="result"></div><p id="help">飛んでくる肉球をタップして受け止めよう。<br>10回ミスしたらおしまい。</p><button class="primary" id="start">猫とあそぶ</button></div></div></div>
<div class="below"><div><div class="name" id="name"></div><div class="trait" id="trait"></div></div><button class="secondary" id="reroll">別の猫を呼ぶ ↻</button><button class="secondary hidden" id="pause">休憩</button></div><p class="instructions">音は右上で切り替えられます。猫が変わるとBGMと声も変わります。<br>肉球が消れる前に、その場所をタップ。空振りも1ミスです。時間とともに猫が本気になります。画面を離れると自動で休憩します。<br></p></main>

<script src="neko-difficulty.js?v=0.1.84"></script>
<script src="neko-diagnostics.js?v=0.1.84"></script>
<script src="neko-records.js?v=0.1.84"></script>

<script>
const $=id=>document.getElementById(id),cats=[{id:'mugi',name:'茶トラのむぎ',trait:'元気な連打タイプ',fur:'#d49a62',stripe:'#a46b3e',interval:1050,window:1100,burst:.3},{id:'kuro',name:'黒猫のくろ',trait:'速い一撃タイプ',fur:'#55565d',stripe:'#414149',interval:1450,window:760,burst:.08},{id:'koma',name:'三毛猫のこま',trait:'気まぐれなリズム',fur:'#ede3d2',stripe:'#ad7653',interval:1200,window:1050,burst:.23},{id:'yuki',name:'白猫のゆき',trait:'のんびり、ときどき両手',fur:'#f5f0e7',stripe:'#d8d1c5',interval:1550,window:1250,burst:.55},{id:'boss',name:'ボス猫のだいごろう',trait:'大きな体で、重い連打',fur:'#8d7663',stripe:'#52473f'},{id:'twins',name:'双子猫のりん・らん',trait:'４本の前足で、交互にパンチ',fur:'#dfa672',stripe:'#ad7243'}];let cat,mode='idle',elapsed=0,last=0,misses=0,hits=0,next=1000,attacks=[],pending=[],feedbackUntil=0,rush=0,shownStage=0;
const sfx=kind=>{if(kind==='hit'){NekoAudio.voice()}else if(kind==='miss')NekoAudio.effect('failure');else if(kind==='over'){NekoAudio.stop();NekoAudio.effect('ending')} };
document.addEventListener('keydown',event=>{if(event.key==='Escape')window.parent.postMessage('neko-close','*')});
function time(ms){return String(Math.floor(ms/60000)).padStart(2,'0')+':'+String(Math.floor(ms/1000)%60).padStart(2,'0')+'.'+Math.floor(ms%1000/100)}
function stats(){$('clock').textContent=time(elapsed);$('hits').textContent=hits;$('missLabel').textContent=`ミス ${misses} / 10`;$('life').innerHTML=Array.from({length:10},(_,i)=>`<i class="${i<misses?'lost':''}"></i>`).join('')}
const catTemplate=document.querySelector('svg.cat').outerHTML;
function renderChoir(){document.getElementById('nekoChoir')?.remove();const stage=document.createElement('div');stage.id='nekoChoir';stage.style.cssText='position:absolute;inset:0;z-index:5;overflow:auto;background:#efece5;display:flex;flex-wrap:wrap;justify-content:center;align-content:center';for(const c of [...cats,cats.find(c=>c.id==='twins')]){const tile=document.createElement('div');tile.style.cssText='width:25%;height:48%;text-align:center;font-size:11px';tile.innerHTML=catTemplate;const svg=tile.querySelector('svg');svg.removeAttribute('class');svg.style.cssText='display:block;width:100%;height:calc(100% - 30px);animation:choirBounce .7s ease-in-out infinite alternate;animation-delay:'+(stage.children.length*.12)+'s';svg.style.setProperty('--fur',stage.children.length===6?'#ece2d4':c.fur);svg.style.setProperty('--stripe',c.stripe);svg.querySelectorAll('[id]').forEach(el=>el.removeAttribute('id'));tile.append(document.createTextNode(c.id==='twins'?(stage.children.length===5?'りん':'らん'):c.name));stage.append(tile)}$('arena').append(stage)}
function renderCats(){const arena=$('arena');arena.querySelectorAll('svg.cat').forEach(el=>el.remove());arena.insertAdjacentHTML('afterbegin',catTemplate);const first=arena.querySelector('svg.cat');if(cat.id==='boss'){const body=first.querySelector('ellipse[cy="225"]');body.setAttribute('rx','87');body.setAttribute('ry','70')}arena.classList.toggle('boss-cat',cat.id==='boss');arena.classList.toggle('twin-cats',cat.id==='twins');if(cat.id==='twins'){const second=first.cloneNode(true);second.querySelector('#left').id='left2';second.querySelector('#right').id='right2';second.classList.add('second-cat');second.style.setProperty('--fur','#ece2d4');second.style.setProperty('--stripe','#8e8175');first.after(second)}}
function sides(){return cat?.id==='twins'?['left','right','left2','right2']:['left','right']}
function clear(){attacks.forEach(a=>a.el.remove());attacks=[];pending=[];for(const side of ['left','right','left2','right2'])if($(side))$(side).setAttribute('class','arm '+(side.startsWith('left')?'left':'right'))}
function choose(requested){NekoRecords.reset();NekoAudio.stop();clear();const options=cats.filter(c=>NekoUnlocks.available().includes(c.id)&&c!==cat);cat=cats.find(c=>c.id===requested&&NekoUnlocks.available().includes(c.id))||options[Math.floor(Math.random()*options.length)];renderCats();NekoUnlocks.playing(false);NekoUnlocks.refresh();NekoAudio.select(cat.id);document.documentElement.style.setProperty('--fur',cat.fur);document.documentElement.style.setProperty('--stripe',cat.stripe);$('name').textContent=$('introName').textContent=cat.name;$('trait').textContent=$('description').textContent=cat.trait;mode='idle';elapsed=misses=hits=0;stats();$('intro').textContent='お相手は…';$('result').textContent='';$('start').textContent='猫とあそぶ';$('overlay').classList.remove('hidden');$('pause').classList.add('hidden');$('reroll').classList.remove('hidden');$('feedback').textContent=''}
function start(){NekoRecords.reset();clear();elapsed=misses=hits=0;next=1000;rush=shownStage=0;mode='playing';NekoUnlocks.playing(true);NekoAudio.bgm();last=performance.now();stats();$('overlay').classList.add('hidden');$('pause').classList.remove('hidden');$('reroll').classList.add('hidden')}
let countTimer=null,countToken=0;
function cancelCountdown(){countToken++;clearTimeout(countTimer);NekoAudio.stop();mode='idle';NekoUnlocks.playing(false);$('start').disabled=false;$('start').textContent='猫とあそぶ';$('intro').textContent='お相手は…';$('introName').textContent=cat.name;$('description').textContent=cat.trait}
async function countdown(){if(mode==='countdown')return;NekoUnlocks.playing(true);await NekoUnlocks.refresh();if(!NekoUnlocks.available().includes(cat.id)){choose();return}mode='countdown';const token=++countToken;$('start').disabled=true;$('start').textContent='準備中…';try{await NekoAudio.ready()}catch{NekoAudio.warning()}if(token!==countToken)return;NekoAudio.stop();NekoAudio.effect('countdown');let count=3;const tick=()=>{if(token!==countToken)return;$('intro').textContent='準備はいい？';$('introName').textContent=count>0?String(count):'スタート！';$('description').textContent=cat.name;count--;if(count>=0)countTimer=setTimeout(tick,1000);else countTimer=setTimeout(()=>{if(token!==countToken)return;$('start').disabled=false;start()},250)};tick()}
function message(s){$('feedback').textContent=s;feedbackUntil=elapsed+600}
function fail(kind='miss'){if(kind!=='face')sfx('miss');misses++;message('ぽすっ！');$('arena').classList.remove('flash');void $('arena').offsetWidth;$('arena').classList.add('flash');stats();if(misses>=10){mode='over';NekoUnlocks.playing(false);NekoRecords.finish({...cat},elapsed,hits);sfx('over');clear();$('overlay').classList.remove('hidden');$('intro').textContent='今日のお相手：'+cat.name;$('introName').textContent='おつかれさま、にゃ。';$('description').textContent=`${hits}回のパンチを受け止めました`;$('result').textContent=time(elapsed);$('start').textContent='同じ猫でもう一度';$('pause').classList.add('hidden');$('reroll').classList.remove('hidden')}}
function arm(side,pose=''){const el=$(side);if(el)el.setAttribute('class','arm '+(side.startsWith('left')?'left':'right')+(pose?' '+pose:''))}
function prepare(side){if(cat.id==='kuro'&&(pending.length||attacks.length))return;if(pending.some(a=>a.side===side)||attacks.some(a=>a.side===side))return;arm(side,'ready');pending.push({side,at:elapsed+300})}
function punch(side){
 const plan=NekoDifficulty.plan(cat.id,elapsed),el=document.createElement('button');
 el.className='target '+plan.type;el.innerHTML='<span aria-hidden="true">🐾</span>'+(plan.taps>1?'<span class="remaining">'+plan.taps+'</span>':'');
 el.style.cssText=`left:${cat.id==='twins'?({left:16,right:39,left2:61,right2:84}[side]):side==='left'?25+Math.random()*15:60+Math.random()*15}%;top:${cat.id==='twins'?(side.endsWith('2')?56:32):30+Math.random()*35}%;width:${plan.size}px;height:${plan.size}px;--window:${plan.window}ms`;
 const a={side,el,end:elapsed+plan.window,remaining:plan.taps};
 const label=()=>el.setAttribute('aria-label',(side==='left'?'左':'右')+'の猫パンチ'+(a.remaining>1?' 残り'+a.remaining+'回':''));label();
 attacks.push(a);$('arena').append(el);arm(side,'punch');
 el.addEventListener('pointerdown',e=>{e.preventDefault();e.stopPropagation();if(mode!=='playing'||!attacks.includes(a))return;
 a.remaining--;if(a.remaining>0){el.querySelector('.remaining').textContent=a.remaining;label();el.classList.toggle('tapped');return}
 attacks=attacks.filter(x=>x!==a);el.remove();arm(side);hits++;sfx('hit');message(['ナイス！','ぱしっ！','受け止めた！'][hits%3]);stats()});
}
function waveAttack(){
 const plan=NekoDifficulty.plan(cat.id,elapsed),side=Math.random()<.5?'left':'right';
 if(cat.id==='twins'){const group=sides();for(let i=0;i<group.length;i++){prepare(group[i]);const item=pending.find(a=>a.side===group[i]);if(item)item.at=elapsed+300+(elapsed<240000?i*160:0)}}else prepare(side);if(cat.id!=='twins'&&Math.random()<plan.pair)prepare(side==='left'?'right':'left');
 let gap=plan.gap*(cat.id==='koma'?.55+Math.random():.9+Math.random()*.2);
 if(cat.id==='mugi'){rush++;if(rush>=3){gap*=2.2;rush=0}else gap*=.8}
 next=elapsed+gap;
}
function pause(){if(mode==='countdown'){cancelCountdown();return}if(mode!=='playing')return;NekoAudio.stop();mode='paused';$('overlay').classList.remove('hidden');$('intro').textContent='ひとやすみ';$('introName').textContent=cat.name+'も休憩中';$('description').textContent='時間は止まっています';$('result').textContent=time(elapsed);$('start').textContent='つづける';attacks.forEach(a=>a.el.style.animationPlayState='paused')}
$('start').onclick=()=>{NekoAudio.unlock();if(mode==='paused'){mode='playing';NekoAudio.bgm();last=performance.now();attacks.forEach(a=>a.el.style.animationPlayState='running');$('overlay').classList.add('hidden')}else countdown()};$('reroll').onclick=()=>{cancelCountdown();choose()};$('pause').onclick=pause;$('arena').addEventListener('pointerdown',e=>{if(mode!=='playing'||e.target.closest('button'))return;const svg=e.target.closest('svg.cat');let face=false;if(svg){const matrix=svg.getScreenCTM();if(matrix){const p=new DOMPoint(e.clientX,e.clientY).matrixTransform(matrix.inverse());face=((p.x-150)/93)**2+((p.y-123)/79)**2<=1}}if(face){NekoAudio.hiss();svg.classList.add('hissing');clearTimeout(svg.hissTimer);svg.hissTimer=setTimeout(()=>svg.classList.remove('hissing'),600);fail('face')}else fail()});document.addEventListener('visibilitychange',()=>{if(document.hidden)pause()});window.addEventListener('blur',pause);
function frame(now){if(mode==='playing'){elapsed+=Math.min(now-last,100);last=now;const stage=Math.min(5,Math.floor(elapsed/60000));if(stage>shownStage){shownStage=stage;message('猫が本気になってきた！')}if(elapsed>=next)waveAttack();const due=pending.filter(a=>a.at<=elapsed);pending=pending.filter(a=>a.at>elapsed);due.forEach(a=>punch(a.side));for(const a of [...attacks]){if(mode!=='playing')break;if(elapsed>=a.end){a.el.remove();attacks=attacks.filter(x=>x!==a);arm(a.side);fail()}}if(elapsed>feedbackUntil)$('feedback').textContent='';stats()}requestAnimationFrame(frame)}choose();requestAnimationFrame(frame);
</script></html>
